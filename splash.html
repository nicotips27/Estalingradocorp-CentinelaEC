<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Centinela BETA</title>
<style>
  :root {
    --brand-blue: #0052cc;
    --brand-blue-dark: #003d99;
    --brand-black: #0d0d0d;
    --brand-gray: #1a1a1a;
    --text-primary: #ffffff;
    --text-secondary: #8a8a8a;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background: var(--brand-black);
    display:flex; align-items:center; justify-content:center;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text-primary);
    user-select:none; overflow:hidden;
  }
  .wrap { text-align:center; padding:32px; }
  .logo {
    width:120px; height:120px; margin:0 auto 24px;
    border-radius:16px; object-fit:cover;
  }
  .title {
    font-size:28px; font-weight:700; letter-spacing:1px;
    color: var(--text-primary);
    margin-bottom:4px;
  }
  .sub {
    font-size:14px; color: var(--text-secondary);
    font-weight:400; margin-bottom:32px;
  }
  .loader {
    width:48px; height:48px; margin:0 auto;
    border:3px solid rgba(0,82,204,0.2);
    border-top-color: var(--brand-blue);
    border-radius:50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .status {
    margin-top:24px; font-size:12px; letter-spacing:0.5px;
    color: var(--text-secondary); font-weight:400;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="logo.jpg" alt="Centinela BETA">
    <div class="title">Centinela BETA</div>
    <div class="sub">Servicio Estalingrado Corp</div>
    <div class="loader" aria-label="Cargando"></div>
    <div class="status">Conectando a la Intra-net…</div>
  </div>
</body>
</html>
