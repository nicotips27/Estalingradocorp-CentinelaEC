<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>METATRON — Historial</title>
<style>
  :root {
    --bg:#07090c; --bg-2:#0d1014; --bg-3:#141920; --bg-4:#1b222b;
    --line:#232a33; --line-2:#2f3946; --text:#d7dde5; --text-2:#8b98a8; --text-3:#5b6675;
    --blue:#367bf0; --blue-2:#5b9bff; --green:#35d07f; --red:#ff4d4f; --cyan:#3fc9d4;
    --mono:"JetBrains Mono","Fira Code","Cascadia Mono",Consolas,"DejaVu Sans Mono","Courier New",monospace;
    --transition:140ms ease;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);font-family:var(--mono);font-size:12px;
    display:flex;flex-direction:column;overflow:hidden;
    background-image:
      linear-gradient(rgba(54,123,240,.05) 1px,transparent 1px) 0 0/100% 28px,
      linear-gradient(90deg,rgba(54,123,240,.05) 1px,transparent 1px) 0 0/28px 100%;
  }
  button,input{font-family:inherit}
  ::selection{background:rgba(54,123,240,.35);color:#fff}

  header{
    flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px;
    border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0f1318,#0a0d11);
  }
  header .tag{color:var(--cyan);font-size:12px;letter-spacing:.24em}
  header .sub{color:var(--text-3);font-size:10px}
  header .sp{flex:1}
  .buscador{
    display:flex;align-items:center;gap:6px;height:26px;padding:0 8px;
    background:var(--bg);border:1px solid var(--line);
  }
  .buscador:focus-within{border-color:var(--blue)}
  .buscador input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--text);font-size:11px}
  .buscador input::placeholder{color:var(--text-3)}
  .btn{
    height:26px;padding:0 11px;flex:none;cursor:pointer;background:var(--bg-2);
    border:1px solid var(--line);color:var(--text-2);font-size:10px;letter-spacing:.1em;
    transition:var(--transition);
  }
  .btn:hover{border-color:var(--blue);color:var(--blue-2);background:var(--bg-4)}
  .btn.peligro:hover{border-color:var(--red);color:var(--red)}

  main{flex:1;min-height:0;overflow-y:auto;padding:8px 14px 14px}
  main::-webkit-scrollbar{width:9px}
  main::-webkit-scrollbar-track{background:var(--bg)}
  main::-webkit-scrollbar-thumb{background:var(--line-2);border:2px solid var(--bg)}

  .grupo{margin:10px 0 4px;font-size:9.5px;letter-spacing:.2em;color:var(--text-3)}
  .item{
    display:flex;align-items:center;gap:9px;padding:5px 8px;cursor:pointer;
    background:var(--bg-2);border:1px solid var(--line);margin-bottom:3px;
    transition:border-color var(--transition),background var(--transition);
  }
  .item:hover{border-color:var(--blue);background:var(--bg-3)}
  .item .fav{
    width:16px;height:16px;flex:none;display:grid;place-items:center;overflow:hidden;
    background:var(--bg);border:1px solid var(--line-2);color:var(--cyan);
  }
  .item .fav img{width:100%;height:100%;object-fit:contain;display:block}
  .item .fav .fav-letra{font-size:8px;font-weight:600;color:var(--text-2)}
  .item .fav svg{width:11px;height:11px}
  .item .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .item .t{font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .u{font-size:9.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .cuando{font-size:9px;color:var(--text-3);flex:none}
  .item .acciones{display:flex;gap:4px;flex:none;opacity:0;transition:var(--transition)}
  .item:hover .acciones{opacity:1}
  .item .acciones button{
    width:22px;height:20px;cursor:pointer;background:var(--bg);border:1px solid var(--line);
    color:var(--text-3);font-size:10px;line-height:1;transition:var(--transition);
  }
  .item .acciones button:hover{border-color:var(--blue);color:var(--blue-2)}
  .item .acciones button.x:hover{border-color:var(--red);color:var(--red)}

  .vacio{padding:40px 10px;text-align:center;color:var(--text-3);font-size:11px}
  .vacio .ico{font-size:22px;color:var(--line-2);margin-bottom:8px}

  footer{
    flex:none;display:flex;align-items:center;gap:12px;height:26px;padding:0 14px;
    border-top:1px solid var(--line);background:var(--bg-2);
    font-size:9.5px;color:var(--text-3);letter-spacing:.08em;
  }
  footer .prompt{color:var(--green)}
  footer .prompt::after{content:"#";color:var(--blue-2)}
  footer .sp{flex:1}
</style>
</head>
<body>

<header>
  <span class="tag">HISTORIAL</span>
  <span class="sub" id="sub">cargando…</span>
  <span class="sp"></span>
  <div class="buscador">
    <span style="color:var(--text-3);font-size:11px">⌕</span>
    <input id="q" type="text" placeholder="buscar por título o dirección" spellcheck="false" autocomplete="off">
  </div>
  <button class="btn peligro" id="vaciar" title="Borrar todo el historial">VACIAR</button>
  <button class="btn" id="cerrar" title="Cerrar la pestaña">✕</button>
</header>

<main id="lista"><div class="vacio"><div class="ico">⌛</div>sin visitas todavía</div></main>

<footer>
  <span class="prompt">root@metatron:</span>
  <span>~/historial</span>
  <span class="sp"></span>
  <span>clic = abrir en la pestaña actual · ⇧ o el botón + = pestaña nueva</span>
</footer>

<script>
const WEB_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18"/></svg>';
const lista = document.getElementById('lista');
const sub = document.getElementById('sub');
const q = document.getElementById('q');

let entradas = [];

// Inicial del dominio: se usa cuando el sitio no tiene favicon utilizable.
function inicialHost(url) {
  try {
    const h = new URL(url).hostname.replace(/^www\./, '');
    return (h[0] || '?').toUpperCase();
  } catch (e) { return '?'; }
}

function host(url) { try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }

function etiquetaDia(ts) {
  const d = new Date(ts);
  const hoy = new Date();
  const ayer = new Date(); ayer.setDate(ayer.getDate() - 1);
  const misma = (a, b) => a.toDateString() === b.toDateString();
  if (misma(d, hoy)) return 'HOY';
  if (misma(d, ayer)) return 'AYER';
  const p2 = n => String(n).padStart(2, '0');
  return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear();
}

function hora(ts) {
  const d = new Date(ts);
  const p2 = n => String(n).padStart(2, '0');
  return p2(d.getHours()) + ':' + p2(d.getMinutes());
}

function esc(value) {
  const amp = String.fromCharCode(38);
  const map = { '&': amp + 'amp;', '<': amp + 'lt;', '>': amp + 'gt;', '"': amp + 'quot;', "'": amp + '#39;' };
  return String(value || '').replace(/[&<>"']/g, ch => map[ch]);
}

function render(items) {
  entradas = items || [];
  lista.innerHTML = '';
  if (!entradas.length) {
    lista.innerHTML = '<div class="vacio"><div class="ico">⌛</div>' +
      (q.value.trim() ? 'ninguna visita coincide con la búsqueda' : 'sin visitas todavía') + '</div>';
    sub.textContent = '0 visitas';
    return;
  }
  sub.textContent = entradas.length + (entradas.length === 1 ? ' visita' : ' visitas');

  let diaActual = '';
  for (const item of entradas) {
    const dia = etiquetaDia(item.ts);
    if (dia !== diaActual) {
      diaActual = dia;
      const g = document.createElement('div');
      g.className = 'grupo';
      g.textContent = dia;
      lista.appendChild(g);
    }

    const el = document.createElement('div');
    el.className = 'item';
    el.title = (item.title || '') + '\n' + item.url;

    const fav = document.createElement('span');
    fav.className = 'fav';
    if (item.fav) {
      const img = document.createElement('img');
      img.src = item.fav;
      img.alt = '';
      img.onerror = () => { fav.innerHTML = '<span class="fav-letra">' + inicialHost(item.url) + '</span>'; };
      fav.appendChild(img);
    } else {
      fav.innerHTML = '<span class="fav-letra">' + inicialHost(item.url) + '</span>';
    }

    const txt = document.createElement('div');
    txt.className = 'txt';
    const t = document.createElement('span');
    t.className = 't';
    t.textContent = item.title || host(item.url);
    const u = document.createElement('span');
    u.className = 'u';
    u.textContent = host(item.url);
    txt.append(t, u);

    const cuando = document.createElement('span');
    cuando.className = 'cuando';
    cuando.textContent = hora(item.ts);

    const acciones = document.createElement('div');
    acciones.className = 'acciones';

    const bNueva = document.createElement('button');
    bNueva.textContent = '+';
    bNueva.title = 'Abrir en una pestaña nueva';
    bNueva.addEventListener('click', ev => { ev.stopPropagation(); window.historial.open(item.url, true); });

    const bX = document.createElement('button');
    bX.textContent = '×';
    bX.className = 'x';
    bX.title = 'Borrar esta visita';
    bX.addEventListener('click', async ev => {
      ev.stopPropagation();
      await window.historial.remove(item.id);
      cargar();
    });

    acciones.append(bNueva, bX);
    el.append(fav, txt, cuando, acciones);

    el.addEventListener('click', () => window.historial.open(item.url, false));
    el.addEventListener('auxclick', ev => { if (ev.button === 1) window.historial.open(item.url, true); });

    lista.appendChild(el);
  }
}

async function cargar() {
  const items = await window.historial.get(q.value.trim());
  render(items);
}

let t = null;
q.addEventListener('input', () => { clearTimeout(t); t = setTimeout(cargar, 200); });

document.getElementById('vaciar').addEventListener('click', async () => {
  if (!entradas.length) return;
  await window.historial.clear();
  cargar();
});
document.getElementById('cerrar').addEventListener('click', () => window.historial.cerrar());

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); q.focus(); q.select(); }
  if (e.key === 'Escape') q.blur();
});

cargar();
</script>
</body>
</html>
